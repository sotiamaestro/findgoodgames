name: Refresh data

on:
  schedule:
    # Weekly full refresh: Mondays 08:17 UTC.
    - cron: '17 8 * * 1'
    # Daily price refresh: 18:23 UTC (Steam sales roll over around 10:00 Pacific).
    - cron: '23 18 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Pipeline mode'
        type: choice
        required: true
        default: full
        options:
          - full
          - prices

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
    steps:
      - name: Check out main (code)
        uses: actions/checkout@v4

      - name: Check out the data branch into .data/
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: data
          path: .data

      - name: Create the data branch if it does not exist yet
        run: |
          if [ ! -d .data/.git ]; then
            rm -rf .data
            mkdir .data
            cd .data
            git init -q -b data
            git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            echo "# data branch" > README.md
            echo "Generated by .github/workflows/refresh-data.yml. Do not edit by hand." >> README.md
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Decide the mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "23 18 * * *" ]; then
            echo "mode=prices" >> "$GITHUB_OUTPUT"
          else
            echo "mode=full" >> "$GITHUB_OUTPUT"
          fi

      - name: Run the pipeline (${{ steps.mode.outputs.mode }})
        run: npx tsx pipeline/build-data.ts --${{ steps.mode.outputs.mode }} --data-dir .data

      - name: Commit and push the data branch if anything changed
        id: push
        run: |
          cd .data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -q -m "data: ${{ steps.mode.outputs.mode }} refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin HEAD:data
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Purge jsDelivr
        if: steps.push.outputs.changed == 'true'
        run: |
          for f in games.json gfn-steam.json; do
            curl -fsS "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@data/$f" || echo "purge of $f failed (jsDelivr will refresh on its own schedule)"
            echo
          done
